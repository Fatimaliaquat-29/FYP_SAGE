<html lang="en">
<head>

<title>Held-out Box Review</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1b1b1b;--muted:#666;--line:#ddd;--accent:#0a7d4f;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1e1e1e;--ink:#eee;--muted:#9a9a9a;--line:#333;--accent:#34d399;--warn:#f59e0b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1e1e1e;--ink:#eee;--muted:#9a9a9a;--line:#333;--accent:#34d399;--warn:#f59e0b;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header h1{font-size:15px;margin:0;font-weight:600}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--muted)}
button.on{border-color:var(--accent);color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.stage{background:#000;border-radius:8px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:auto}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;align-self:start}
aside h2{font-size:16px;margin:0 0 6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.tag.uns{border-color:var(--warn);color:var(--warn)}.tag.flag{border-color:var(--bad);color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.sw{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
textarea{width:100%;min-height:60px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.strip{display:flex;gap:2px;flex-wrap:wrap;margin:12px 16px 24px;max-width:1500px}
.strip span{width:9px;height:14px;border-radius:2px;background:var(--line);cursor:pointer}
.strip span.uns{background:var(--warn)}.strip span.flag{background:var(--bad)}.strip span.ok{background:var(--accent)}
.strip span.cur{outline:2px solid var(--ink)}
.muted{color:var(--muted);font-size:12px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>

const IMG = "../../../handlabels/round6_heldout/images/";
const KEY = "heldout-review-v1";
let review = {};

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(review)); } catch (e) {} };
const st = { i: 0, bright: false, zoom: false, old: true, list: FRAMES.map((_, i) => i) };
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const cache = {};
function img(f) {
  if (!cache[f]) { const im = new Image(); im.src = IMG + f + ".jpg"; im.onload = () => { if (cur().f === f) draw(); }; cache[f] = im; }
  return cache[f];
}
const cur = () => FRAMES[st.list[st.i]];
function applyFilter() {
  const v = document.getElementById("filter").value;
  st.list = FRAMES.map((fr, i) => [fr, i]).filter(([fr]) =>
    v === "all" ? true : v === "uns" ? fr.uns === "1" : v === "flag" ? review[fr.f]?.s === "flag" :
    v === "unrev" ? !review[fr.f]?.s : fr.clip === v).map(([, i]) => i);
  st.i = 0; render();
}
function draw() {
  const fr = cur(); if (!fr) { cx.clearRect(0, 0, cv.width, cv.height); return; }
  const im = img(fr.f);
  const person = fr.new.filter(b => b[0] === 0);
  let vx = 0, vy = 0, vw = 1, vh = 1;
  if (st.zoom) {
    const all = person.concat(st.old ? fr.old : []);
    if (all.length) {
      let x0 = Math.min(...all.map(b => b[1])), y0 = Math.min(...all.map(b => b[2])), x1 = Math.max(...all.map(b => b[3])), y1 = Math.max(...all.map(b => b[4]));
      const pad = 0.04; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(1, x1 + pad); y1 = Math.min(1, y1 + pad);
      let w = x1 - x0, h = y1 - y0; const ar = 16 / 9;
      if (w / h * ar < ar) { const nw = h * 1080 / 1920 * 16 / 9; } // keep simple: expand to frame aspect
      if (w * 1920 / (h * 1080) > ar) { const nh = w * 1920 / ar / 1080; y0 = Math.max(0, Math.min(1 - nh, y0 - (nh - h) / 2)); h = Math.min(1, nh); }
      else { const nw = h * 1080 * ar / 1920; x0 = Math.max(0, Math.min(1 - nw, x0 - (nw - w) / 2)); w = Math.min(1, nw); }
      vx = x0; vy = y0; vw = w; vh = h;

  cx.save();
  cx.filter = st.bright ? "brightness(2.4) contrast(1.15) saturate(0.9)" : "none";
  if (im.complete && im.naturalWidth) cx.drawImage(im, vx * 1920, vy * 1080, vw * 1920, vh * 1080, 0, 0, 1920, 1080);
  else { cx.fillStyle = "#000"; cx.fillRect(0, 0, 1920, 1080); }
  cx.restore();
  const R = (b, col, lw, dash) => {
    const x = (b[1] - vx) / vw * 1920, y = (b[2] - vy) / vh * 1080, w = (b[3] - b[1]) / vw * 1920, h = (b[4] - b[2]) / vh * 1080;
    cx.setLineDash(dash || []); cx.lineWidth = lw; cx.strokeStyle = col; cx.strokeRect(x, y, w, h); cx.setLineDash([]);

}
function render() {
  const fr = cur();
  document.getElementById("pos").textContent = fr ? `${st.i + 1} / ${st.list.length}` : "0 / 0";
  if (!fr) { document.getElementById("title").textContent = "No frames match"; document.getElementById("meta").innerHTML = ""; document.getElementById("tags").innerHTML = ""; draw(); strip(); return; }
  document.getElementById("title").textContent = fr.f;
  const r = review[fr.f] || {};
  const tags = [];
  if (fr.uns === "1") tags.push('<span class="tag uns">unsure</span>');
  if (r.s === "flag") tags.push('<span class="tag flag">flagged</span>');
  if (r.s === "ok") tags.push('<span class="tag">✓ reviewed</span>');
  document.getElementById("tags").innerHTML = tags.join(" ");
  const pb = fr.new.filter(b => b[0] === 0).map(b => b.slice(1).map(v => v.toFixed(3)).join("  ")).join("<br>") || "none";
  const ob = fr.old.map(b => b.slice(1).map(v => v.toFixed(3)).join("  ")).join("<br>") || "none";
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  document.getElementById("meta").innerHTML =
    `<dt>Decision</dt><dd>${esc(fr.dec)}</dd><dt>New box</dt><dd>${pb}</dd><dt>Original</dt><dd>${ob}</dd>` +

    `<dt>How</dt><dd>${esc(fr.note.replace(/^Claude: /, ""))}</dd>`;
  document.getElementById("note").value = r.n || "";

}

  const c = cur();

  });
}

document.getElementById("next").onclick = () => { if (st.i < st.list.length - 1) { st.i++; render(); } };

["bright", "zoom", "old"].forEach(k => document.getElementById(k).onclick = () => { st[k] = !st[k]; render(); });
document.getElementById("ok").onclick = () => mark("ok");
document.getElementById("bad").onclick = () => mark("flag");
document.getElementById("note").oninput = e => { const fr = cur(); if (!fr) return; review[fr.f] = { ...(review[fr.f] || {}), n: e.target.value }; save(); };
document.getElementById("export").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["frame", "review", "note"]].concat(FRAMES.map(fr => [fr.f, review[fr.f]?.s || "", review[fr.f]?.n || ""]));
  const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "claude_labels_review.csv"; a.click();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "arrowright") document.getElementById("next").click();
  else if (k === "arrowleft") document.getElementById("prev").click();
  else if (k === "a") mark("ok"); else if (k === "f") mark("flag");
  else if (k === "b" || k === "z" || k === "o") { const m = { b: "bright", z: "zoom", o: "old" }[k]; st[m] = !st[m]; render(); }
